name: getx_starter_kit
description: "Production-grade GetX starter kit for Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  get: ^4.7.3
  dio: ^5.11.1
  get_storage: ^2.1.1
  flutter_secure_storage: ^10.3.1
  connectivity_plus: ^7.1.0
  package_info_plus: ^9.0.1
  path_provider: ^2.1.4
  intl: ^0.20.1
  uuid: ^4.5.1
  logger: ^2.5.0
  pretty_dio_logger: ^1.4.0
  dio_cache_interceptor: ^3.5.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.15
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  flutter_screenutil: ^5.9.3
  permission_handler: ^11.3.1
  device_info_plus: ^11.3.3
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  freezed: ^2.5.7
  flutter_lints: ^6.0.0
  flutter_gen_runner: ^5.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/locales/
